<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HearMeOut — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F1D1C; --surface:#2A2725; --surface-2:#332F2C; --line:#433E3A;
    --lime:#FC7B03; --coral:#C75E00; --text:#E6DEDA; --muted:#948C86;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#121110; font-family:'Inter',sans-serif; color:var(--text);
    display:flex; flex-direction:column; align-items:center; min-height:100vh;
    padding:20px 12px 40px; gap:18px;
  }
  .view-switch{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; }
  .vs-btn{ font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 16px; border-radius:999px; border:none; background:transparent; color:var(--muted); cursor:pointer; }
  .vs-btn.active{ background:var(--lime); color:#1F1D1C; font-weight:600; }
  .toast{ position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-12px); background:var(--lime); color:#1F1D1C; font-weight:600; font-size:13px; padding:10px 18px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:999; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--lime); text-transform:uppercase; margin-bottom:6px; }
  h1.page-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; letter-spacing:-.01em; margin-bottom:18px; }
  .search-bar{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:20px; }
  .search-bar svg{ flex-shrink:0; }
  .search-bar input{ background:none; border:none; outline:none; color:var(--text); font-family:'Inter',sans-serif; font-size:14px; width:100%; }
  .search-bar input::placeholder{ color:var(--muted); }

  .chips{ display:flex; gap:8px; overflow-x:auto; margin-bottom:22px; padding-bottom:2px; scrollbar-width:none; -ms-overflow-style:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:7px 13px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; flex-shrink:0; cursor:pointer; background:none; }
  .chip.on{ background:var(--lime); color:#1F1D1C; border-color:var(--lime); font-weight:600; }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .section-head h2{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; display:flex; align-items:center; }
  .section-head span{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); }
  .unknown-badge{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; border:1.4px solid var(--lime); color:var(--lime); font-size:10px; font-weight:700; margin-right:6px; font-family:'IBM Plex Mono',monospace; flex-shrink:0; }

  .cover{ cursor:pointer; }
  .cover .art{ position:relative; border-radius:12px; display:flex; align-items:flex-end; justify-content:flex-start; padding:8px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:rgba(255,255,255,.85); background-size:cover; background-position:center; border:1px solid var(--line); }
  .cover .meta{ margin-top:7px; }
  .cover .meta .t{ font-weight:600; line-height:1.25; }
  .cover .meta .a{ color:var(--muted); margin-top:1px; }
  .empty-state{ color:var(--muted); font-size:13px; padding:20px 0; text-align:center; }
  .archive-note{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:18px; }
  .archive-card{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .archive-card .art-sm{ width:48px; height:48px; border-radius:8px; flex-shrink:0; background-size:cover; background-position:center; background-color:var(--surface-2); border:1px solid var(--line); }
  .archive-card .info .t{ font-size:13.5px; font-weight:600; }
  .archive-card .info .a{ font-size:11.5px; color:var(--muted); }
  .archive-loading{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); padding:14px 0; text-align:center; }
  .lib-subhead{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:16px 0 10px; }
  .dz-preview-wrap{ margin-bottom:16px; }
  .dz-preview-player{ margin-top:8px; }
  .dz-preview-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); margin-bottom:6px; }
  .artist-art{ border-radius:50%; }
  .artist-art .fallback-letter{ font-size:24px; }

  /* history / activity items */
  .activity-item{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .activity-item .thumb{ width:42px; height:42px; border-radius:8px; background-size:cover; background-position:center; flex-shrink:0; border:1px solid var(--line); }
  .activity-item .body{ flex:1; font-size:12.5px; min-width:0; }
  .activity-item .body b{ font-weight:600; }
  .activity-item .stars-dot{ display:block; margin-top:2px; }
  .activity-item .when{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  .cover-fallback{ background:linear-gradient(135deg,var(--surface-2),var(--line)) !important; display:flex; align-items:center; justify-content:center; }
  .cover-fallback .fallback-letter{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--muted); font-size:28px; }

  /* connect / recap / friends / awards */
  .connect-row{ display:flex; flex-direction:column; gap:8px; }
  .connect-btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; text-align:left; }
  .connect-btn.on{ border-color:var(--lime); color:var(--lime); background:rgba(252,123,3,.08); }

  /* segmented control (day/month/season etc) */
  .segmented{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px; }
  .segmented button{ flex:1; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; padding:9px 4px; border-radius:9px; border:none; background:none; color:var(--muted); cursor:pointer; transition:background .15s ease, color .15s ease; }
  .segmented button.on{ background:var(--lime); color:#1F1D1C; }

  /* recap teaser card (home screen) */
  .recap-teaser{ position:relative; border-radius:16px; overflow:hidden; padding:18px; margin-bottom:26px; cursor:pointer; background:linear-gradient(135deg, var(--surface-2), var(--bg)); border:1px solid var(--line); }
  .recap-teaser::before{ content:''; position:absolute; inset:0; background:linear-gradient(135deg, rgba(252,123,3,.20), transparent 65%); pointer-events:none; }
  .recap-teaser .rt-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--lime); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; position:relative; }
  .recap-teaser h3{ font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; margin-bottom:6px; position:relative; }
  .recap-teaser p{ font-size:12px; color:var(--muted); position:relative; }
  .recap-teaser .rt-arrow{ position:absolute; top:16px; right:18px; color:var(--lime); font-size:18px; }

  /* full-screen recap (Super Fan style takeover) */
  .recap-full-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:26px; }
  .recap-close{ background:var(--surface); border:1px solid var(--line); color:var(--text); width:34px; height:34px; flex-shrink:0; border-radius:50%; cursor:pointer; font-size:14px; }
  .recap-full-top .segmented{ flex:1; }
  .recap-hero{ text-align:center; margin-bottom:28px; }
  .recap-hero-avatar{ width:64px; height:64px; border-radius:50%; margin:0 auto 12px; background:linear-gradient(135deg,var(--lime),var(--coral)); background-size:cover; background-position:center; }
  .recap-hero-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; }
  .recap-hero-period{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--lime); letter-spacing:.14em; margin:6px 0 16px; text-transform:uppercase; }
  .recap-hero-vibe{ font-size:17px; font-style:italic; color:var(--text); line-height:1.4; max-width:300px; margin:0 auto; }
  .recap-stats-row{ display:flex; justify-content:center; gap:28px; margin-bottom:30px; }
  .recap-stat{ text-align:center; }
  .recap-stat .rv{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:var(--lime); }
  .recap-stat .rl{ font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); margin-top:2px; }
  .recap-section{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .recap-section-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
  .recap-rank-row{ display:flex; gap:10px; padding:6px 0; font-size:13.5px; }
  .recap-rank-row .rr-num{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--lime); width:18px; flex-shrink:0; }
  .recap-genre-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .recap-open-btn{ width:100%; background:linear-gradient(135deg, var(--lime), var(--coral)); border:none; color:#1F1D1C; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; padding:14px; border-radius:14px; cursor:pointer; margin-bottom:22px; }

  .recap-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .recap-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .recap-period{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }
  .recap-minutes{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); }
  .recap-vibe{ font-style:italic; font-size:12.5px; color:var(--lime); margin-bottom:14px; line-height:1.4; }
  .recap-cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:12px; }
  .recap-col-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
  .recap-item{ font-size:12px; margin-bottom:4px; }
  .recap-genres{ display:flex; gap:6px; flex-wrap:wrap; }

  .friend-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .friend-row .info{ flex:1; min-width:0; cursor:pointer; }
  .friend-row .info .n{ font-size:13px; font-weight:600; }
  .friend-row .info .h{ font-size:11px; color:var(--muted); }
  .friend-row button{ font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--text); cursor:pointer; flex-shrink:0; }
  .friend-row button.added{ border-color:var(--lime); color:var(--lime); }

  .award-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .award-label{ color:var(--muted); }
  .award-name{ font-weight:600; color:var(--lime); flex-shrink:0; }

  .compare-block{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:22px; }
  .compare-score{ text-align:center; margin-bottom:16px; }
  .compare-score .v{ font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; color:var(--lime); }
  .compare-score .l{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .compare-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:11px; }
  .compare-row .g{ width:64px; flex-shrink:0; color:var(--muted); }
  .compare-row .bars{ flex:1; display:flex; flex-direction:column; gap:3px; }
  .compare-row .bars .b{ height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .compare-row .bars .b i{ display:block; height:100%; border-radius:3px; }
  .compare-row .bars .me i{ background:var(--lime); }
  .compare-row .bars .fr i{ background:var(--muted); }
  .compare-legend{ display:flex; gap:14px; justify-content:center; margin-top:10px; font-size:10.5px; color:var(--muted); }
  .compare-legend i{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }

  .list-row{ display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .list-row .art-sm{ width:46px; height:46px; border-radius:8px; flex-shrink:0; background-size:cover; background-position:center; border:1px solid var(--line); }
  .list-row .info .t{ font-size:13.5px; font-weight:600; }
  .list-row .info .a{ font-size:11.5px; color:var(--muted); }
  .list-row .rank{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--lime); width:20px; }
  .list-row .n{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); width:18px; }

  .btn-primary{ background:var(--lime); color:#1F1D1C; border:none; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; padding:15px; border-radius:14px; cursor:pointer; margin-bottom:10px; transition:filter .15s ease; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--line); font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; padding:13px; border-radius:14px; cursor:pointer; margin-bottom:22px; transition:border-color .15s ease, color .15s ease; }
  .btn-ghost.added{ border-color:var(--lime); color:var(--lime); }

  .review-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .review-card .head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .review-card .user{ display:flex; align-items:center; gap:8px; }
  .avatar{ width:26px; height:26px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); background-size:cover; background-position:center; }
  .review-card .uname{ font-size:12.5px; font-weight:600; }
  .stars-dot{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--lime); }
  .review-card p{ font-size:12.5px; color:#CFC7C1; line-height:1.5; }

  .star-rating{ position:relative; display:inline-block; line-height:1; }
  .star-rating .layer{ letter-spacing:4px; white-space:nowrap; user-select:none; }
  .star-rating .base{ color:var(--line); }
  .star-rating .fill{ position:absolute; top:0; left:0; overflow:hidden; color:var(--lime); }
  .star-rating.avg .layer{ font-size:19px; }
  .star-rating.interactive{ cursor:pointer; touch-action:none; }
  .star-rating.interactive .layer{ font-size:40px; }

  .review-box{ width:100%; min-height:110px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; color:var(--text); font-family:'Inter',sans-serif; font-size:13.5px; margin-bottom:16px; text-align:left; resize:none; outline:none; }
  .review-box::placeholder{ color:var(--muted); }

  .avatar-lg{ width:64px; height:64px; border-radius:50%; flex-shrink:0; cursor:pointer; position:relative; background:linear-gradient(135deg,var(--lime),var(--coral)); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; border:2px solid var(--line); }
  .avatar-lg .hint{ font-family:'IBM Plex Mono',monospace; font-size:9px; color:#1F1D1C; font-weight:700; text-align:center; background:rgba(230,222,218,.85); border-radius:50%; width:100%; height:100%; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s ease; }
  .avatar-lg:hover .hint{ opacity:1; }
  .avatar-lg.has-img .hint{ display:none; }
  .avatar-sm{ width:40px; height:40px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); background-size:cover; background-position:center; flex-shrink:0; }

  .name-input{ background:none; border:none; border-bottom:1.5px solid transparent; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; padding:2px 0; width:100%; outline:none; transition:border-color .15s ease; }
  .name-input:focus, .name-input:hover{ border-color:var(--line); }
  .handle-input{ background:none; border:none; border-bottom:1.5px solid transparent; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:2px 0; margin-top:3px; width:100%; outline:none; transition:border-color .15s ease; }
  .handle-input:focus, .handle-input:hover{ border-color:var(--line); }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:24px; }
  .stat-grid .box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; }
  .stat-grid .box .v{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; color:var(--lime); }
  .stat-grid .box .l{ font-size:9.5px; color:var(--muted); margin-top:2px; font-family:'IBM Plex Mono',monospace; }

  .genre-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .genre-row .name{ font-size:12px; width:74px; flex-shrink:0; color:var(--muted); }
  .genre-row .track{ flex:1; height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .genre-row .fill{ height:100%; background:linear-gradient(90deg,var(--lime),var(--coral)); border-radius:4px; }

  .top4-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:24px; }
  .top4-grid .art{ width:100%; aspect-ratio:1; border-radius:9px; background-size:cover; background-position:center; border:1px solid var(--line); position:relative; }
  .top4-grid .art .rank{ position:absolute; top:4px; left:5px; font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--lime); }

  /* ==================== MOBILE SHELL ==================== */
  .mobile-shell{ display:none; }
  .mobile-shell.show{ display:flex; }
  .device{ width:390px; max-width:100%; height:780px; background:var(--bg); border-radius:36px; border:8px solid #000; overflow:hidden; position:relative; display:flex; flex-direction:column; box-shadow:0 30px 60px -20px rgba(0,0,0,.6); }
  .statusbar{ height:38px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); flex-shrink:0; }
  .m-screens{ flex:1; position:relative; overflow:hidden; }
  .m-screen{ position:absolute; inset:0; overflow-y:auto; padding:4px 20px 24px; opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity .28s ease, transform .28s ease; }
  .m-screen.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .m-screen::-webkit-scrollbar{ display:none; }
  .row-scroll{ display:flex; gap:12px; overflow-x:auto; margin-bottom:26px; padding-bottom:4px; scrollbar-width:none; -ms-overflow-style:none; }
  .row-scroll::-webkit-scrollbar{ display:none; }
  .mobile-shell .row-scroll .cover{ width:104px; flex-shrink:0; }
  .mobile-shell .row-scroll .cover .art{ width:104px; height:104px; }
  .mobile-shell .cover .meta .t{ font-size:12.5px; }
  .mobile-shell .cover .meta .a{ font-size:11px; }
  .grid-cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:26px; }
  .grid-cards .cover{ width:100%; }
  .grid-cards .cover .art{ width:100%; height:auto; aspect-ratio:1; }

  .tabbar{ display:flex; border-top:1px solid var(--line); background:rgba(31,29,28,.94); backdrop-filter:blur(6px); flex-shrink:0; }
  .tab{ flex:1; text-align:center; padding:12px 4px 10px; cursor:pointer; color:var(--muted); background:none; border:none; }
  .tab .ic{ display:flex; justify-content:center; margin-bottom:4px; }
  .tab .ic svg{ width:20px; height:20px; }
  .tab .num{ font-size:17px; line-height:1; }
  .tab .lbl{ font-size:10.5px; font-family:'Inter',sans-serif; font-weight:500; }
  .tab.active{ color:var(--lime); }

  .back-btn{ display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin:14px 0 16px; cursor:pointer; background:none; border:none; }
  .album-hero{ text-align:center; margin-bottom:18px; }
  .album-hero .art-lg{ width:180px; height:180px; border-radius:16px; margin:0 auto 16px; background-size:cover; background-position:center; border:1px solid var(--line); box-shadow:0 20px 40px -14px rgba(0,0,0,.7); }
  .album-hero h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; }
  .album-hero .sub{ color:var(--muted); font-size:13px; margin-top:4px; }
  .album-hero .tags{ display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .avg-rating{ display:flex; align-items:center; justify-content:center; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin:18px 0; }

function esc(s){ return (s||'').replace(/</g,'&lt;'); }
function starsAvgHTML(rating){

  return `<div class="star-rating avg"><div class="layer base">★★★★★</div><div class="layer fill" style="width:${pct}%">★★★★★</div></div>`;
}
function starsText(n){ const full=Math.round(n); return '★'.repeat(full)+'☆'.repeat(Math.max(0,5-full)); }

  const q = STATE.searchQuery.trim().toLowerCase();
  const genreFilter = STATE.activeGenre;
  const isFiltering = q.length>0 || genreFilter!=='Всё';

  const searchBarHTML = device==='mobile' ? `
    <div class="eyebrow">Главное</div>

    </div>` : '';

  const genres = ['Всё','Rock','Hip-Hop','Electronic','R&B','Pop','Latin'];
  const chipsHTML = `<div class="chips">${genres.map(g=>`<button class="chip ${g===genreFilter?'on':''}" data-genre="${g}">${g}</button>`).join('')}</div>`;

  const sortOptions = [
    {key:'year', label:'По году'},
    {key:'genre', label:'По жанру'},
    {key:'artist', label:'По исполнителю'},
  ];
  const sortHTML = `<div class="chips" data-sort-group>${sortOptions.map(s=>`<button class="chip ${STATE.sortBy===s.key?'on':''}" data-sort="${s.key}">${s.label}</button>`).join('')}</div>`;

  if(isFiltering){
    const results = ALBUMS.filter(a=>{
      const matchesQ = !q || a.title.toLowerCase().includes(q) || a.artist.toLowerCase().includes(q);
      const matchesG = genreFilter==='Всё' || a.genreBucket===genreFilter;
      return matchesQ && matchesG;
    });
    const showLive = q.length >= 2 && genreFilter==='Всё';
    return `${searchBarHTML}${chipsHTML}
      <div class="section-head"><h2>В каталоге HearMeOut</h2><span>${results.length}</span></div>

      ` : '' }
    `;
  }

  const topRated = [...ALBUMS].sort((a,b)=>b.rating-a.rating).slice(0,3);
  const unknownAlbums = ALBUMS.filter(a=>a.unknown);

  const sorted = [...ALBUMS].sort((a,b)=>{
    if(STATE.sortBy==='year') return a.year-b.year;
    if(STATE.sortBy==='genre') return a.genreBucket.localeCompare(b.genreBucket) || a.year-b.year;
    return a.artist.localeCompare(b.artist);
  });

  return `${searchBarHTML}${chipsHTML}
    ${recapTeaserHTML()}
    <div class="section-head"><h2>🔥 В тренде сейчас</h2><span>Deezer, живые данные</span></div>

    <div class="${rowClass}">${unknownAlbums.map(albumCardHTML).join('')}</div>

    <div class="section-head" style="margin-top:26px;"><h2>Весь каталог</h2><span>${ALBUMS.length}</span></div>
    ${sortHTML}

  `;
}

async function openArtist(mbid, name){
  STATE.currentArtist = { id: mbid, name, albums: null, loading: true, error: null };
  renderScreen('artist');
  showScreen('artist');
  try {
    const url = `https://musicbrainz.org/ws/2/release-group?artist=${mbid}&type=album&fmt=json&limit=24`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if(!res.ok) throw new Error('MusicBrainz request failed: ' + res.status);
    const data = await res.json();
    STATE.currentArtist.albums = (data['release-groups']||[]).sort((a,b)=>(a['first-release-date']||'9999').localeCompare(b['first-release-date']||'9999'));
  } catch(err){
    const isFileProtocol = location.protocol === 'file:';
    STATE.currentArtist.error = isFileProtocol
      ? 'Браузер блокирует запросы к внешним сайтам при открытии файла напрямую (file://). Загрузите файл на хостинг, чтобы это заработало.'
      : ('Не удалось загрузить альбомы (' + err.message + ')');
  }
  STATE.currentArtist.loading = false;
  renderScreen('artist');
}

      return a.title.toLowerCase().includes(q) || a.artist.toLowerCase().includes(q);
    });

  const body = ratings.length
    ? ratings.map(historyItemHTML).join('')
    : (q ? '<div class="empty-state">Ничего не найдено среди ваших оценок</div>' : '<div class="empty-state">Вы ещё не оценили ни один альбом.<br>Откройте каталог и поставьте первую оценку.</div>');
  return `
    <div class="eyebrow">История оценок</div>
    <h1 class="page-title">Ваши оценки</h1>
    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

    </div>
    ${body}
  `;
}

/* ============================== DEEZER (via CORS proxy) — chart, artist photos, real previews ============================== */
function corsProxy(url){ return 'https://corsproxy.io/?url=' + encodeURIComponent(url); }

async function fetchDeezerChart(container){
  try {
    const res = await fetch(corsProxy('https://api.deezer.com/chart/0/albums?limit=20'));
    if(!res.ok) throw new Error('Deezer chart request failed: ' + res.status);
    const data = await res.json();
    const albums = data.data || [];
    if(!albums.length){ container.innerHTML = '<div class="empty-state">Чарт временно недоступен</div>'; return; }
    container.innerHTML = albums.map((a,i)=>`
      <div class="cover">
        <div class="art" data-cover-url="${a.cover_medium}" data-fallback-letter="${esc((a.artist?.name||'?')[0])}" style="background-image:url('${a.cover_medium}')">
          <span style="position:absolute;top:6px;left:6px;background:var(--lime);color:#1F1D1C;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;">#${i+1}</span>
        </div>
        <div class="meta"><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist?.name||'')}</div></div>
      </div>`).join('');
    attachImageFallback(container);
  } catch(err){
    const isFileProtocol = location.protocol === 'file:';
    container.innerHTML = isFileProtocol
      ? '<div class="empty-state">Чарт Deezer требует хостинга (не работает при открытии файла напрямую) — см. инструкцию по GitHub Pages.</div>'
      : `<div class="empty-state">Чарт Deezer сейчас недоступен (${esc(err.message)}). CORS-прокси иногда лежит или лимитирует запросы — это не баг кода, а внешняя зависимость.</div>`;
  }
}

async function fetchDeezerArtistPhoto(name, imgEl){
  try {
    const res = await fetch(corsProxy(`https://api.deezer.com/search/artist?q=${encodeURIComponent(name)}&limit=1`));
    if(!res.ok) return;
    const data = await res.json();
    const artist = (data.data||[])[0];
    if(artist && artist.picture_medium){
      imgEl.style.backgroundImage = `url('${artist.picture_medium}')`;
      imgEl.classList.remove('cover-fallback');
      const letter = imgEl.querySelector('.fallback-letter'); if(letter) letter.remove();
    }
  } catch(err){ /* silently keep letter fallback */ }
}

async function loadTrackPreview(albumTitle, artistName, playerEl){
  playerEl.innerHTML = '<div class="archive-loading">Ищу превью на Deezer…</div>';
  try {
    const res = await fetch(corsProxy(`https://api.deezer.com/search?q=${encodeURIComponent(artistName + ' ' + albumTitle)}&limit=1`));
    if(!res.ok) throw new Error('request failed');
    const data = await res.json();
    const track = (data.data||[])[0];
    if(!track || !track.preview){ playerEl.innerHTML = '<div class="empty-state">Превью не найдено на Deezer</div>'; return; }
    playerEl.innerHTML = `
      <div class="dz-preview-label">30-сек превью «${esc(track.title)}» · Deezer</div>
      <audio controls style="width:100%; height:36px;" src="${track.preview}"></audio>`;
  } catch(err){
    const isFileProtocol = location.protocol === 'file:';
    playerEl.innerHTML = isFileProtocol
      ? '<div class="empty-state">Требует хостинга — не работает при открытии файла напрямую (file://).</div>'
      : '<div class="empty-state">Не удалось получить превью с Deezer сейчас.</div>';
  }
}

/* ============================== LIVE MUSICBRAINZ ARCHIVE SEARCH ============================== */
async function runLiveLibrarySearch(query, resultsEl){
  try {
    const albumsUrl = `https://musicbrainz.org/ws/2/release-group/?query=${encodeURIComponent(query)}&fmt=json&limit=8`;
    const artistsUrl = `https://musicbrainz.org/ws/2/artist/?query=${encodeURIComponent(query)}&fmt=json&limit=6`;
    const [albumsRes, artistsRes] = await Promise.all([
      fetch(albumsUrl, { headers: { 'Accept': 'application/json' } }),
      fetch(artistsUrl, { headers: { 'Accept': 'application/json' } })
    ]);
    if(!albumsRes.ok && !artistsRes.ok) throw new Error('MusicBrainz request failed: ' + albumsRes.status);
    const albumsData = albumsRes.ok ? await albumsRes.json() : {'release-groups':[]};
    const artistsData = artistsRes.ok ? await artistsRes.json() : {artists:[]};
    const groups = (albumsData['release-groups'] || []).filter(g => g['primary-type'] === 'Album' || !g['primary-type']);
    const artists = artistsData.artists || [];

    if(!groups.length && !artists.length){
      resultsEl.innerHTML = '<div class="empty-state">Ничего не найдено в открытой библиотеке</div>';
      return;
    }

    let html = '';
    if(artists.length){
      html += `<div class="lib-subhead">Артисты</div><div class="row-scroll">${artists.map(ar=>`
        <div class="cover" data-open-artist="${ar.id}" data-artist-name="${esc(ar.name)}">
          <div class="art artist-art cover-fallback" data-artist-photo-for="${esc(ar.name)}"><span class="fallback-letter">${esc((ar.name[0]||'?').toUpperCase())}</span></div>
          <div class="meta"><div class="t">${esc(ar.name)}</div><div class="a">${esc(ar.type||'Артист')}</div></div>
        </div>`).join('')}</div>`;
    }
    if(groups.length){
      html += `<div class="lib-subhead">Альбомы</div><div class="grid-cards">${groups.map(g=>{
        const artist = (g['artist-credit'] || []).map(c=>c.name).join(', ') || 'Неизвестный артист';
        const year = g['first-release-date'] ? g['first-release-date'].slice(0,4) : '—';
        const coverUrl = `https://coverartarchive.org/release-group/${g.id}/front-250`;
        return `<div class="cover">
          <div class="art" data-cover-url="${coverUrl}" data-fallback-letter="${esc(artist[0]||'?')}" style="background-image:url('${coverUrl}')"></div>
          <div class="meta"><div class="t">${esc(g.title)}</div><div class="a">${esc(artist)} · ${year}</div></div>
        </div>`;
      }).join('')}</div>`;
    }
    resultsEl.innerHTML = html;
    resultsEl.querySelectorAll('[data-artist-photo-for]').forEach(el=> fetchDeezerArtistPhoto(el.dataset.artistPhotoFor, el));
    attachImageFallback(resultsEl);
  } catch(err){
    const isFileProtocol = location.protocol === 'file:';
    resultsEl.innerHTML = isFileProtocol
      ? `<div class="empty-state">Браузер блокирует запросы к внешним сайтам, потому что файл открыт напрямую (file://). Это ограничение безопасности браузера, а не баг кода.<br><br>Решение: загрузите этот HTML-файл на любой хостинг (например GitHub Pages, Netlify) или откройте его через локальный сервер — тогда живой поиск заработает.</div>`
      : `<div class="empty-state">Не удалось получить данные из MusicBrainz (${esc(err.message)}). Попробуйте ещё раз чуть позже — у открытого API есть лимит запросов.</div>`;
  }
}


function attachImageFallback(container){
  container.querySelectorAll('[data-cover-url]').forEach(el=>{
    const url = el.dataset.coverUrl;
    if(!url || el.dataset.fbChecked) return;
    el.dataset.fbChecked = '1';
    const img = new Image();
    img.onerror = ()=>{
      el.classList.add('cover-fallback');
      el.style.backgroundImage = 'none';
      if(!el.querySelector('.fallback-letter')){
        el.insertAdjacentHTML('afterbegin', `<span class="fallback-letter">${el.dataset.fallbackLetter || '?'}</span>`);
      }
    };
    img.src = url;
  });
}

    const device = container.dataset.device;

    else if(name==='album') html = renderAlbum(device, STATE.currentAlbumId);
    else if(name==='rate') html = renderRate(device, STATE.currentAlbumId);
    else if(name==='history') html = renderHistory(device);
    else if(name==='recap') html = renderRecap(device, STATE.recapViewUserId, STATE.recapPeriod);
    else if(name==='profile') html = renderProfile(device);
    else if(name==='artist') html = renderArtist(device);
    else if(name==='friend') html = renderFriend(device, STATE.viewingUserId);
    container.innerHTML = html;
    wireScreen(container, name);
    attachImageFallback(container);
    const chartEl = container.querySelector('[data-deezer-chart]');
    if(chartEl) fetchDeezerChart(chartEl);
    const artistPhotoEls = container.querySelectorAll('[data-artist-photo-for]');
    artistPhotoEls.forEach(el=> fetchDeezerArtistPhoto(el.dataset.artistPhotoFor, el));
    const previewEl = container.querySelector('[data-preview-auto]');
    if(previewEl) loadTrackPreview(previewEl.dataset.title, previewEl.dataset.artist, previewEl);
  });
}
function renderAll(){ ['catalog','album','rate','history','recap','profile','artist','friend'].forEach(renderScreen); }

/* ============================== NAVIGATION ============================== */
const TAB_GROUP = { catalog:'catalog', album:'catalog', artist:'catalog', history:'history', rate:'history', profile:'profile', friend:'profile' };
function showScreen(name){
  STATE.activeScreen = name;
  document.querySelectorAll('[data-screen]').forEach(s=> s.classList.toggle('active', s.dataset.screen===name));
  document.querySelectorAll('[data-tab]').forEach(t=> t.classList.toggle('active', t.dataset.tab===(TAB_GROUP[name]||name)));
  document.querySelectorAll('.m-screens, .d-content').forEach(c=> c.scrollTop = 0);
}
function openAlbum(id){ STATE.currentAlbumId = id; renderScreen('album'); renderScreen('rate'); showScreen('album'); }
function openRateFor(id, origin){
  STATE.currentAlbumId = id;
  STATE.rateOrigin = origin || 'album';
  const existing = USERS.me.ratings.find(r=>r.albumId===id);
  STATE.ratingValue = existing ? existing.stars : 0;
  STATE.ratingDraftText = existing ? (existing.text || '') : '';
  renderScreen('rate');
  showScreen('rate');
}
function viewFriend(id){ STATE.viewingUserId = id; renderScreen('friend'); showScreen('friend'); }
function openRecap(userId){
  STATE.recapViewUserId = userId;
  STATE.recapOrigin = STATE.activeScreen;
  renderScreen('recap');
  showScreen('recap');
}
function closeRecap(){ showScreen(STATE.recapOrigin || 'catalog'); }

/* ============================== TOAST ============================== */
const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1700);
}

/* ============================== EVENT WIRING (delegated per screen container) ============================== */
function wireScreen(container, name){
  container.querySelectorAll('[data-open-album]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openAlbum(el.dataset.openAlbum); });
  });
  container.querySelectorAll('[data-genre]').forEach(chip=>{
    chip.addEventListener('click', ()=>{ STATE.activeGenre = chip.dataset.genre; renderScreen('catalog'); });
  });
  container.querySelectorAll('[data-sort]').forEach(chip=>{
    chip.addEventListener('click', ()=>{ STATE.sortBy = chip.dataset.sort; renderScreen('catalog'); });
  });
  container.querySelectorAll('[data-search-input]').forEach(input=>{
    input.addEventListener('input', ()=>{
      STATE.searchQuery = input.value;
      renderScreen('catalog');
      const live = container.querySelector('[data-search-input]');
      if(live){ live.focus(); live.selectionStart = live.selectionEnd = live.value.length; }
      const resultsEl = container.querySelector('[data-live-results]');
      if(resultsEl){
        clearTimeout(window.__hmoLibDebounce);
        const q = STATE.searchQuery.trim();
        window.__hmoLibDebounce = setTimeout(()=> runLiveLibrarySearch(q, resultsEl), 450);
      }
    });
  });
  container.querySelectorAll('[data-back-catalog]').forEach(b=> b.addEventListener('click', ()=> showScreen('catalog')));
  container.querySelectorAll('[data-back-dynamic]').forEach(b=> b.addEventListener('click', ()=> showScreen(STATE.rateOrigin==='history' ? 'history' : 'album')));
  container.querySelectorAll('[data-rate-cta]').forEach(b=> b.addEventListener('click', ()=> openRateFor(b.dataset.rateCta, 'album')));
  container.querySelectorAll('[data-edit-rating]').forEach(el=> el.addEventListener('click', ()=> openRateFor(el.dataset.editRating, 'history')));
  container.querySelectorAll('[data-open-artist]').forEach(el=>{
    el.addEventListener('click', ()=> openArtist(el.dataset.openArtist, el.dataset.artistName));
  });
  container.querySelectorAll('[data-history-search]').forEach(input=>{
    input.addEventListener('input', ()=>{ STATE.historyQuery = input.value; renderScreen('history');
      const live = container.querySelector('[data-history-search]'); if(live){ live.focus(); live.selectionStart = live.selectionEnd = live.value.length; }
    });
  });

  container.querySelectorAll('[data-wishlist]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const added = b.classList.toggle('added');
      b.textContent = added ? '✓ В списке «Хочу послушать»' : '+ В список «Хочу послушать»';
      showToast(added ? 'Добавлено в список' : 'Убрано из списка');
    });
  });

  container.querySelectorAll('[data-publish]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const albumId = b.dataset.publish;
      const album = ALBUMS.find(a=>a.id===albumId);
      const val = STATE.ratingValue || 0;
      if(val<=0){ showToast('Сначала выберите оценку'); return; }
      const textArea = container.querySelector('[data-review-text]');
      const text = textArea ? textArea.value.trim() : '';

      const existing = USERS.me.ratings.find(r=>r.albumId===albumId);
      if(existing){
        // editing an existing rating — update in place, don't double-count
        if(album && existing.text && !text){
          album.reviews = album.reviews.filter(r=>!(r.user==='me'));
        } else if(album && text){
          const rev = album.reviews.find(r=>r.user==='me');
          if(rev){ rev.stars = val; rev.text = text; }
          else { album.reviews.unshift({user:'me', stars:val, text}); if(!existing.text) USERS.me.stats.reviews += 1; }
        }
        if(!text) { /* removed review text but kept rating */ }
        existing.stars = val; existing.text = text || null; existing.when = 'только что';
      } else {
        // brand new rating
        if(album){
          if(text) album.reviews.unshift({user:'me', stars:val, text});
          album.ratingsCount += 1;
        }
        USERS.me.stats.ratings += 1;
        if(text) USERS.me.stats.reviews += 1;
        USERS.me.ratings.push({albumId, stars:val, text: text || null, when:'только что'});
      }
      STATE.ratingValue = 0;
      STATE.ratingDraftText = '';
      showToast(existing ? 'Оценка обновлена' : 'Опубликовано');
      renderScreen('album'); renderScreen('profile'); renderScreen('history');
      showScreen(STATE.rateOrigin==='history' ? 'history' : 'album');
    });
  });

  container.querySelectorAll('[data-star-picker]').forEach(picker=>{
    const fill = picker.querySelector('.fill');
    const wrap = picker.closest('.rate-wrap, .d-rate-panel') || container;
    const label = wrap.querySelector('[data-star-label]');
    let dragging = false;
    function valueFromEvent(e){
      const rect = picker.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const frac = Math.max(0, Math.min(1, x/rect.width));
      return Math.round(frac*5*10)/10;
    }
    function apply(val){
      STATE.ratingValue = val;
      fill.style.width = (val/5*100)+'%';
      if(label) label.textContent = 'Оценка — '+val.toFixed(1)+' / 5';
    }
    picker.addEventListener('pointerdown', e=>{ dragging=true; picker.setPointerCapture(e.pointerId); apply(valueFromEvent(e)); });
    picker.addEventListener('pointermove', e=>{ if(dragging) apply(valueFromEvent(e)); });
    picker.addEventListener('pointerup', ()=> dragging=false);
  });

  container.querySelectorAll('[data-avatar]').forEach(avatar=>{
    const input = avatar.querySelector('[data-avatar-input]');
    avatar.addEventListener('click', ()=> input.click());
    input.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        USERS.me.avatarImg = reader.result;
        renderScreen('profile');
      };
      reader.readAsDataURL(file);
    });
  });

  container.querySelectorAll('[data-name-input]').forEach(inp=> inp.addEventListener('change', ()=>{ USERS.me.name = inp.value; }));
  container.querySelectorAll('[data-handle-input]').forEach(inp=> inp.addEventListener('change', ()=>{ USERS.me.handle = inp.value; }));

  container.querySelectorAll('[data-connect]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.connect;
      USERS.me.connections[key] = !USERS.me.connections[key];
      showToast(USERS.me.connections[key] ? 'Подключено' : 'Отключено');
      renderScreen('profile');
    });
  });

  container.querySelectorAll('[data-open-recap]').forEach(el=>{
    el.addEventListener('click', ()=> openRecap(el.dataset.openRecap));
  });
  container.querySelectorAll('[data-recap-close]').forEach(b=> b.addEventListener('click', closeRecap));
  container.querySelectorAll('[data-rperiod]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      STATE.recapPeriod = btn.dataset.rperiod;
      renderScreen('recap');
    });
  });

  container.querySelectorAll('[data-view-friend]').forEach(el=> el.addEventListener('click', ()=> viewFriend(el.dataset.viewFriend)));
  container.querySelectorAll('[data-back-profile]').forEach(b=> b.addEventListener('click', ()=> showScreen('profile')));
  container.querySelectorAll('[data-add-friend]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.addFriend;
      if(!USERS.me.friends.includes(id)){
        USERS.me.friends.push(id);
        USERS[id].friends.push('me');
        showToast('Добавлено в друзья');
        renderScreen('profile');
      }
    });
  });
}

/* ============================== TOP-LEVEL NAV & VIEW SWITCH ============================== */
document.querySelectorAll('[data-tab]').forEach(t=> t.addEventListener('click', ()=> showScreen(t.dataset.tab)));

document.querySelectorAll('[data-search-input]').forEach(input=>{
  input.addEventListener('input', ()=>{
    STATE.searchQuery = input.value;
    renderScreen('catalog');
    showScreen('catalog');
    const resultsEl = document.querySelector('[data-screen="catalog"][data-device="desktop"] [data-live-results]');
    if(resultsEl){
      clearTimeout(window.__hmoLibDebounceTop);
      const q = STATE.searchQuery.trim();
      window.__hmoLibDebounceTop = setTimeout(()=> runLiveLibrarySearch(q, resultsEl), 450);
    }
  });
});

const vsBtns = document.querySelectorAll('.vs-btn');
const mobileShell = document.getElementById('mobile-shell');
const desktopShell = document.getElementById('desktop-shell');
vsBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    vsBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    mobileShell.classList.toggle('show', view==='mobile');
    desktopShell.classList.toggle('show', view==='desktop');
  });
});

/* ============================== INIT ============================== */
renderAll();
showScreen('catalog');
</script>
</body>
</html>
